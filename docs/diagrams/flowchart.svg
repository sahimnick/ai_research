<text x="672" y="152" fill="#93a0b4" font-size="11.5">look(frame) -&gt; Percept    ONE pass</text>
<text x="672" y="168" fill="#93a0b4" font-size="11.5"></text>
<text x="672" y="184" fill="#93a0b4" font-size="11.5">min_confidence 0.35  -&gt; LOST if below</text>
<text x="672" y="200" fill="#93a0b4" font-size="11.5">search_radius 40px   near last seen</text>
<text x="672" y="216" fill="#93a0b4" font-size="11.5">exclusion_px 30      ids never share</text>
<text x="672" y="232" fill="#93a0b4" font-size="11.5">max_lost 12          id expires</text>
